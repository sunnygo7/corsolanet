name: Update GTS Data

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action type (upload, claim, clear_hexocc, or register)'
        required: true
        type: string
      payload:
        description: 'JSON payload of data'
        required: true
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure JSON files exist
        run: |
          if [ ! -f gts_listings.json ]; then echo '{"listings": [], "hexocc": []}' > gts_listings.json; fi
          if [ ! -f gts_accounts.json ]; then echo '{}' > gts_accounts.json; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process data via Python
        env:
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          python -c '
          import json, os
          
          action = os.environ["ACTION_TYPE"]
          data = json.loads(os.environ["PAYLOAD"])
          
          listings_path = "gts_listings.json"
          db = {"listings": [], "hexocc": []}
          if os.path.exists(listings_path):
              try:
                  loaded = json.load(open(listings_path))
                  if isinstance(loaded, dict):
                      db = loaded
                  elif isinstance(loaded, list):
                      db = {"listings": loaded, "hexocc": []}
              except:
                  pass
          
          if action == "upload":
              db["listings"].append(data)
              
          elif action == "claim":
              index = data["index"]
              buyer_hex = data["hexocc"]
              if 0 <= index < len(db["listings"]):
                  item = db["listings"].pop(index)
                  item["hexocc"] = buyer_hex
                  db["hexocc"].append(item)
                  
          elif action == "clear_hexocc":
              trade_id = data.get("trade_id")
              db["hexocc"] = [item for item in db["hexocc"] if item.get("Data") != trade_id]
              
          elif action == "register":
              file_path = "gts_accounts.json"
              accounts = json.load(open(file_path)) if os.path.exists(file_path) else {}
              username = data["username"].lower()
              accounts[username] = {"password_hash": data["password_hash"]}
              with open(file_path, "w") as f:
                  json.dump(accounts, f, indent=2)
              exit()

          with open(listings_path, "w") as f:
              json.dump(db, f, indent=2)
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "GTS update: ${{ github.event.inputs.action_type }}"
          file_pattern: "gts_listings.json gts_accounts.json"
