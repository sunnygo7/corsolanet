name: Update GTS Data

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action type (upload or register)'
        required: true
        type: string
      payload:
        description: 'JSON payload of data'
        required: true
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process data via Python
        env:
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          python -c '
          import json, os
          
          action = os.environ["ACTION_TYPE"]
          data = json.loads(os.environ["PAYLOAD"])
          
          if action == "upload":
              file_path = "gts_listings.json"
              listings = json.load(open(file_path)) if os.path.exists(file_path) else []
              listings.append(data)
              with open(file_path, "w") as f:
                  json.dump(listings, f, indent=2)
                  
          elif action == "register":
              file_path = "gts_accounts.json"
              accounts = json.load(open(file_path)) if os.path.exists(file_path) else {}
              username = data["username"]
              accounts[username] = {
                  "password_hash": data["password_hash"],
                  "security_question": data["security_question"],
                  "answer_hash": data["answer_hash"]
              }
              with open(file_path, "w") as f:
                  json.dump(accounts, f, indent=2)
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "GTS update: ${{ github.event.inputs.action_type }}"
          file_pattern: "gts_listings.json gts_accounts.json"
